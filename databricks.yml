# This is a Declarative Automation Bundle definition for dabproj1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproj1
  uuid: 22255754-e0dc-4b2f-80db-c14528c73b82

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616751913603.3.azuredatabricks.net/
    variables:
      catalog: workspace1
      schema: default
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/afsheensafam@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/afsheensafam@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace1
      schema: prod
    permissions:
      - user_name: afsheensafam@gmail.com
        level: CAN_MANAGE
